basePath: /api/v1
definitions:
  main.User:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: John Doe
        type: string
    type: object
host: localhost:3001
info:
  contact: {}
  description: This is a sample server for demonstrating Swagger in Go using Gin.
  title: Go Swagger Example API
  version: "1.0"
paths:
  /users:
    post:
      consumes:
        - application/json
      description: Create user with JSON payload
      parameters:
        - description: User to create
          in: body
          name: user
          required: true
          schema:
            $ref: "#/definitions/main.User"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/main.User"
      summary: Create a new user
      tags:
        - users
  /users/{id}:
    get:
      consumes:
        - application/json
      description: Get user by ID
      parameters:
        - description: User ID
          in: path
          name: id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/main.User"
        "400":
          description: Bad request
          schema:
            type: string
      summary: Get a user by ID
      tags:
        - users
swagger: "2.0"
